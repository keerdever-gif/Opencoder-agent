services:
  opencoder-agent:
    build: .
    container_name: opencoder-agent
    env_file:
      - .env
    environment:
      OPENCODER_WORKSPACE: /app/workspace
    ports:
      - "${WEB_PORT:-${PORT:-8080}}:${WEB_PORT:-${PORT:-8080}}"
    volumes:
      - ./workspace:/app/workspace
    restart: unless-stopped
